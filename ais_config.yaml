# ==========================================
# AIS 配置解析文件
# ==========================================

# 1. 航行状态详细定义 (ITU-R M.1371 标准)
# 对应 AIS 报文中的 status 字段 (0-15)
nav_status:
  0: "在航(使用引擎)"
  1: "锚泊"
  2: "失控(Not under command)"
  3: "操纵能力受限"
  4: "吃水受限"
  5: "系泊(Moored)"
  6: "搁浅"
  7: "从事捕鱼"
  8: "在航(使用帆)"
  9: "保留(HSC)"
  10: "保留(WIG)"
  11: "保留"
  12: "保留"
  13: "保留"
  14: "AIS-SART(搜救发射器)"
  15: "未定义(默认)"

# 2. AIS 原始类型详细描述
# 用于生成 "AIS原始详细类别" 列
# 格式: 编码范围前缀 : 描述模板
# ==========================================
# 完整的 AIS 船型映射 (ITU-R M.1371)
# ==========================================
ship_type_details:
  # --- 0-19: 保留 ---
  0: "未定义/保留"
  
  # --- 20-29: 地效翼船 (WIG) ---
  20: "地效翼船(WIG)-通用"
  21: "地效翼船(WIG)-危险A"
  22: "地效翼船(WIG)-危险B"
  23: "地效翼船(WIG)-危险C"
  24: "地效翼船(WIG)-危险D"
  29: "地效翼船(WIG)-无信息"

  # --- 30-39: 特殊作业 ---
  30: "渔船(Fishing)"
  31: "拖带中(Towing)"
  32: "拖带中(长>200m)"
  33: "疏浚/水下作业"
  34: "潜水作业"
  35: "军事/执法行动"
  36: "帆船(Sailing)"
  37: "游艇(Pleasure Craft)"
  38: "保留(38)"
  39: "保留(39)"

  # --- 40-49: 高速船 (HSC) ---
  40: "高速船(HSC)-通用"
  41: "高速船(HSC)-危险A"
  42: "高速船(HSC)-危险B"
  43: "高速船(HSC)-危险C"
  44: "高速船(HSC)-危险D"
  49: "高速船(HSC)-无信息"

  # --- 50-59: 特殊/辅助 ---
  50: "引航船(Pilot)"
  51: "搜救船(SAR)"
  52: "拖轮(Tug)"
  53: "港口供应船"
  54: "防污染船"
  55: "执法船"
  56: "本地船舶(56)"
  57: "本地船舶(57)"
  58: "医疗运输"
  59: "中立国非交战船"

  # --- 60-69: 客轮 (Passenger) ---
  60: "客轮-通用"
  61: "客轮-危险A"
  62: "客轮-危险B"
  63: "客轮-危险C"
  64: "客轮-危险D"
  69: "客轮-无信息"

  # --- 70-79: 货轮 (Cargo) ---
  70: "货轮-通用"
  71: "货轮-危险A"
  72: "货轮-危险B"
  73: "货轮-危险C"
  74: "货轮-危险D"
  79: "货轮-无信息"

  # --- 80-89: 油轮 (Tanker) ---
  80: "油轮-通用"
  81: "油轮-危险A"
  82: "油轮-危险B"
  83: "油轮-危险C"
  84: "油轮-危险D"
  89: "油轮-无信息"

  # --- 90-99: 其他 (Other) ---
  90: "其他-通用"
  91: "其他-危险A"
  92: "其他-危险B"
  93: "其他-危险C"
  94: "其他-危险D"
  99: "其他-无信息"

# ==========================================
# 3. 映射到视觉检测的标签规则 (9类)
# ==========================================
detection_mapping:
  # 1. 渔船
  - name: "fishing boat"
    codes: [30]

  # 2. 拖船
  - name: "tug"
    codes: [31, 32, 50, 52]

  # 3. 油轮
  - name: "oil tanker"
    ranges: [[80, 89]]

  # 4. 客船 (包含渡轮、高速客船、邮轮)
  - name: "passenger ship"
    ranges: [[60, 69], [40, 49]]

  # 5. 普通货船 (包含散货、集装箱)
  - name: "general cargo vessels"
    ranges: [[70, 79]]

  # 6. 海警船 (Coast Guard Ship) [NEW]
  # 包含: 55(执法), 51(搜救), 35(军事)
  - name: "coast guard ship"
    codes: [35, 51, 55]

  # --- 占位符 (无法仅通过 AIS Type 区分) ---
  - name: "bulk carrier"
    codes: [] # 混在 general cargo

  - name: "container ship"
    codes: [] # 混在 general cargo

  # 7. 其他 (Other)
  - name: "other"
    # 剩余: 20-29(地效翼), 33-34(作业), 36-37(帆船游艇), 53-54(港口防污), 56-59(本地/医疗), 90-99
    codes: [33, 34, 36, 37, 53, 54, 56, 57, 58, 59]
    ranges: [[20, 29], [90, 99]]